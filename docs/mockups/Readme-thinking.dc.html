<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>steady-suggest: writing a suggestion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#e8a58c}a:hover{color:#f3c2ae}
</style>
</helmet>
<div style="width: 900px; height: 300px; box-sizing: border-box; padding: 24px 40px 20px; background: #262624; color: #e8e6e1; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px">
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #2b2a28; border-radius: 10px; font-size: 13px; line-height: 1.45">
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
        <button type="button" aria-label="Older prompt" style="font: inherit; padding: 0; background: transparent; border: 0; color: #e8e6e1">▲</button>
        <button type="button" aria-label="Newer prompt" disabled style="font: inherit; padding: 0; background: transparent; border: 0; color: #a3a09a">▼</button>
        <span style="color: #a3a09a">4/4</span>
      </div>
      <p style="flex: 1; min-width: 0; margin: 0; text-align: right">add a dark mode toggle to the settings page and remember the choice</p>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="26" height="8" viewBox="0 0 26 8" aria-hidden="true"><circle cx="4" cy="4" r="3" fill="#d97757" opacity="1"></circle><circle cx="13" cy="4" r="3" fill="#d97757" opacity="0.6"></circle><circle cx="22" cy="4" r="3" fill="#d97757" opacity="0.3"></circle></svg>
      <span style="color: #a3a09a">Thinking of an Autopilot suggestion…</span>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #30302e; border: 1px solid #45433f; border-radius: 14px">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#a8a59e" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true"><path d="M9 3v12M3 9h12"></path></svg>
    <p style="flex: 1; min-width: 0; margin: 0; font-size: 15px; color: #8d8a83">Type / for commands</p>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#a8a59e" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true"><rect x="6.5" y="2.5" width="5" height="9" rx="2.5"></rect><path d="M4 9a5 5 0 0 0 10 0M9 14v2"></path></svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":300}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
